<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <linearGradient id="sakuraFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A9C" />
      <stop offset="60%" stop-color="#FF4B72" />
      <stop offset="100%" stop-color="#E62855" />
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="400" height="420" rx="32" fill="#0E1018" />

  <g transform="translate(0, 0)">
    <!-- 1. Outer Neon Ring -->
    <circle cx="200" cy="180" r="135" fill="none" stroke="#FF4B72" stroke-width="4" />
    <circle cx="200" cy="180" r="135" fill="none" stroke="#FFA8BE" stroke-width="1.2" opacity="0.8" />

    <!-- 2. Inner Rounded Hexagon Shield -->
    <path
      d="M 200,55
         C 205,55 270,95 280,102
         C 290,110 292,118 292,130
         L 292,230
         C 292,242 288,250 278,258
         C 268,265 205,305 200,305
         C 195,305 132,265 122,258
         C 112,250 108,242 108,230
         L 108,130
         C 108,118 110,110 120,102
         C 130,95 195,55 200,55 Z"
      fill="none"
      stroke="#FF4B72"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- 3. Three Sakura Cherry Blossom Petals on Left -->
    <!-- Upper Petal -->
    <path
      d="M 195,138
         C 180,120 162,105 148,116
         C 141,121 139,128 144,130
         C 140,134 140,140 148,146
         C 162,156 180,149 195,138 Z"
      fill="url(#sakuraFill)"
      opacity="0.95"
    />

    <!-- Middle Petal -->
    <path
      d="M 195,180
         C 172,169 144,157 130,169
         C 124,174 124,180 131,182
         C 125,185 125,192 133,197
         C 148,204 174,193 195,180 Z"
      fill="url(#sakuraFill)"
      opacity="0.95"
    />

    <!-- Lower Petal -->
    <path
      d="M 195,218
         C 180,232 162,246 148,235
         C 141,230 139,223 144,221
         C 140,217 140,211 148,205
         C 162,195 180,204 195,218 Z"
      fill="url(#sakuraFill)"
      opacity="0.95"
    />

    <!-- 4. Center Vertical Dividing Stroke -->
    <line x1="195" y1="88" x2="195" y2="272" stroke="#FF4B72" stroke-width="4.5" stroke-linecap="round" />

    <!-- 5. Japanese Kanji 様 (Right: 羊 + 氺) -->
    <g stroke="#FF4B72" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 216,118 L 225,127" />
      <path d="M 254,118 L 245,127" />
      <path d="M 212,133 L 258,133" />
      <path d="M 216,149 L 254,149" />
      <path d="M 201,172 L 269,172" />
      <path d="M 235,127 L 235,240" stroke-width="4.8" />
      <path d="M 233,182 L 216,210" />
      <path d="M 237,182 L 259,208" />
      <path d="M 213,224 L 222,233" />
      <path d="M 259,224 L 250,233" />
    </g>

    <!-- 6. Cybernetic Circuit Traces & Hexagonal Nodes -->
    <g stroke="#FF4B72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 235,103 L 235,86 L 246,78" />
      <polygon points="250,73 256,76 256,81 250,84 244,81 244,76" fill="#0E1018" stroke="#FF4B72" stroke-width="2.2" />

      <path d="M 258,133 L 270,121 L 270,113" />
      <polygon points="270,108 275,111 275,116 270,119 265,116 265,111" fill="#0E1018" stroke="#FF4B72" stroke-width="2.2" />

      <path d="M 269,172 L 282,172" />
      <polygon points="287,167 292,170 292,175 287,178 282,175 282,170" fill="#0E1018" stroke="#FF4B72" stroke-width="2.2" />

      <path d="M 248,236 L 260,246 L 270,246" />
      <polygon points="276,241 281,244 281,249 276,252 271,249 271,244" fill="#0E1018" stroke="#FF4B72" stroke-width="2.2" />

      <path d="M 195,272 L 195,288 L 190,292" />
      <polygon points="190,287 195,290 195,295 190,298 185,295 185,290" fill="#0E1018" stroke="#FF4B72" stroke-width="2.2" />
    </g>

    <!-- 7. Wordmark: Otaku-Sama -->
    <text
      x="200"
      y="368"
      text-anchor="middle"
      font-family="system-ui, -apple-system, 'Comfortaa', 'Quicksand', 'Outfit', sans-serif"
      font-size="38"
      font-weight="600"
      letter-spacing="1"
      fill="#FF688B"
    >
      Otaku-Sama
    </text>
  </g>
</svg>
